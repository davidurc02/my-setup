# reload config file 
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
unbind r

# other stuff
set -g mouse on
set -g pane-scrollbars modal
set -s copy-command 'pbcopy'
# set -g prefix C-s

# switch panes using Alt-arrow without prefix
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D
# NOTE: On macOS using the default Terminal.app, this fails because macOS does not treat the Option (Alt) key as a Meta key by default
# SOLUTION: go to Terminal > Settings > Profiles > Keyboard > Select "Use Option as Meta key"

# switch windows using Ctrl-Tab
bind-key -n M-NPage next-window
bind-key -n M-PPage previous-window

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

#factory default
set -g @plugin 'hallazzang/tmux-reset'

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour9'

# messages
set -g message-style 'fg=colour232 bg=colour16 bold'

# set default shell on tmux
set-option -g default-shell /bin/zsh

# Start window (tab) numbering at 1
set -g base-index 1
# Start pane numbering at 1 (optional, for consistency)
setw -g pane-base-index 1
# Automatically renumber windows when one is closed (e.g., closing 2 moves 3 to 2)
set -g renumber-windows on

